global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'app'
    static_configs:
      - targets: ['app:8081']

  - job_name: 'postgres'
    static_configs:
      - targets: ['promExporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redisExporter:9121']
